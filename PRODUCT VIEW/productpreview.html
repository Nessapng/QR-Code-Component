<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=3.58">
    <title>Product Preview Card Component</title>
    <link rel="stylesheet" href="index.css">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Outfit:wght@100..900&display=swap" rel="stylesheet">"
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Outfit:wght@100..900&display=swap" rel="stylesheet"> 
</head>
<body>
    <div class="product-card">
        <img src="/images/img1.jpg" alt="Product Image" class="product-image" />
        <div class="product-details">
                <p class="product-label">P E R F U M E</p>
                <h2 class="product-title">Gabrielle
                    <br> Essence Eau 
                    <br> De Parfum
                </h2>
                <p class="product-description">
                    A floral, solar and voluptuous interpretation composed by Olivier Polge,
                    Perfumer-Creator for the House of CHANEL.
                </p>
                <div class="product-price">
                    <span class="new-price">$149.99</span>
                    <span class="old-price">$169.99</span>
                </div>
                <button class="add-to-cart">
                    Add to Cart
                </button>
            </div>

        </div>
    </div>
</body>

</html>
